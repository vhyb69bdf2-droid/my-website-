<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherRoom</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
<h1>CipherRoom</h1>
<p class="subtitle">Multiplayer Number Deduction Game</p>

<div class="card">
<h2>Room</h2>

<div class="room-row">
<button id="createRoom">Create Room</button>
<input id="roomInput" maxlength="4" placeholder="ABCD">
<button id="joinRoom">Join Room</button>
</div>

<p id="roomCode">Room: ----</p>
<p id="status">Local mode active.</p>
</div>

<div class="card">
<h2>Settings</h2>

<div class="mode-row">
<button id="easyMode" class="active">Easy</button>
<button id="hardMode">Hard</button>
</div>

<label>
<input type="checkbox" id="repeatDigits">
Allow Repeat Digits
</label>

<label>
Code Length
<select id="codeLength">
<option value="3">3 Digits</option>
<option value="4">4 Digits</option>
<option value="5">5 Digits</option>
</select>
</label>
</div>

<div class="card">
<h2>Your Secret</h2>
<input id="secretInput" value="907">
<button id="lockSecret">Lock Secret</button>
<p id="secretStatus">Secret ready.</p>
</div>

<div class="card">
<h2>Guess</h2>

<form id="guessForm">
<input id="guessInput" value="538">
<button type="submit">Guess</button>
</form>
</div>

<div class="grid">
<div class="card">
<h2>Your Guesses</h2>
<div id="history"></div>
</div>

<div class="card">
<h2>Nova's Guesses</h2>
<div id="novaHistory"></div>
</div>
</div>

<div class="card">
<h2>Digit Tracker (Easy Only)</h2>
<div id="tracker"></div>
</div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
